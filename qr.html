<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dama Play IBO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 30px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .text {
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .text {
                font-size: 1rem;
            }
            .logo {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo_qr.png" alt="Logo" class="logo">
        <p class="text">
            HOLA, SI TIENE ALGUNA DUDA PARA INICIAR SESIÓN, PÓNGASE EN CONTACTO CON SU PROVEEDOR DE CANALES.
        </p>
    </div>
</body>
</html>
